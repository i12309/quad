<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#11161f">
    <title>QUAD — игры из больших пикселей</title>
    <link rel="stylesheet" href="styles.css">
    <script src="./src/konva.min.js"></script>
</head>
<body>
    <main id="app-ui">
        <section id="start-menu" class="menu-panel" aria-labelledby="app-title">
            <header class="menu-header">
                <p class="eyebrow">PIXEL PLAYGROUND</p>
                <h1 id="app-title">QUAD</h1>
                <p>Набор маленьких игр, где весь мир собран из крупных квадратных пикселей.</p>
            </header>

            <p id="loading-status" class="loading-status" role="status" aria-live="polite">
                Загружаю игры…
            </p>
            <div id="game-buttons-container" aria-label="Выбор игры"></div>
        </section>

        <section id="game-controls" class="game-toolbar" hidden aria-label="Управление игрой">
            <div class="game-heading">
                <span id="game-icon" class="toolbar-icon" aria-hidden="true">🎮</span>
                <span>
                    <strong id="game-title">Игра</strong>
                    <small id="game-description"></small>
                </span>
            </div>

            <div class="control-buttons">
                <div id="grid-scale-control" class="grid-scale-control" hidden>
                    <span class="grid-scale-label">Клетка</span>
                    <button id="grid-scale-decrease" class="scale-button" type="button"
                        aria-label="Уменьшить квадратики">−</button>
                    <input id="grid-scale-input" type="range" min="8" max="32" step="2" value="12"
                        aria-label="Размер квадратиков">
                    <button id="grid-scale-increase" class="scale-button" type="button"
                        aria-label="Увеличить квадратики">+</button>
                    <output id="grid-scale-value" for="grid-scale-input">12 px</output>
                </div>
                <button id="start-stop-btn" class="primary-button" type="button">Старт</button>
                <button id="clear-btn" type="button">Заново</button>
                <button id="back-to-menu-btn" type="button">Все игры</button>
            </div>

            <p id="game-status" class="game-status" role="status" aria-live="polite"></p>
        </section>
    </main>

    <div id="container" aria-label="Игровое поле"></div>

    <script type="module" src="./src/app.js"></script>
</body>
</html>
